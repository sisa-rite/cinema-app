name: Deploy to Rahti

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BACKEND_IMAGE: docker.io/shoracko26/cinema-backend
  FRONTEND_IMAGE: docker.io/shoracko26/cinema-frontend
  API_URL: https://cinema-backend-rio-cinema.2.rahtiapp.fi
  RAHTI_PROJECT: rio-cinema

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          build-args: VITE_API_URL=${{ env.API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to Rahti
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "4"

      - name: Log in to Rahti
        run: oc login --token="${{ secrets.RAHTI_TOKEN }}" --server="${{ secrets.RAHTI_SERVER }}"

      - name: Roll out new version
        run: |
          oc project "$RAHTI_PROJECT"
          oc set image deploy/cinema-backend backend="$BACKEND_IMAGE:${{ github.sha }}"
          oc set image deploy/cinema-frontend frontend="$FRONTEND_IMAGE:${{ github.sha }}"
          oc rollout status deploy/cinema-backend --timeout=180s
          oc rollout status deploy/cinema-frontend --timeout=180s
