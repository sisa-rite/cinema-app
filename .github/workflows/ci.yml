name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  frontend:
    name: Frontend — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cinema:cinema@localhost:5432/cinema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - run: npm run seed
      - run: npm test

  e2e:
    name: E2E — Cypress
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema
          POSTGRES_DB: cinema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cinema:cinema@127.0.0.1:5432/cinema
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Backend/package-lock.json
            Frontend/package-lock.json

      - name: Backend — install, migrate, seed
        working-directory: Backend
        run: |
          npm ci
          npm run migrate
          npm run seed
      - name: Backend — start
        working-directory: Backend
        run: npm start > backend.log 2>&1 &
        env:
          PORT: 3000
          CORS_ORIGIN: http://127.0.0.1:4173
      - name: Backend — wait until ready
        working-directory: Backend
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/health/db && exit 0; sleep 2; done
          cat backend.log
          exit 1

      - name: Frontend — install and build
        working-directory: Frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: http://127.0.0.1:3000
      - name: Frontend — start
        working-directory: Frontend
        run: npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
      - name: Frontend — wait until ready
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 > /dev/null && exit 0; sleep 2; done
          cat Frontend/preview.log
          exit 1

      - name: Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: Frontend
          install: false
          config: baseUrl=http://127.0.0.1:4173

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: Frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Print server logs
        if: failure()
        run: |
          cat Backend/backend.log || true
          cat Frontend/preview.log || true
