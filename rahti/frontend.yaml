apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinema-frontend
  labels:
    app: cinema-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cinema-frontend
  template:
    metadata:
      labels:
        app: cinema-frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/shoracko26/cinema-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cinema-frontend
spec:
  selector:
    app: cinema-frontend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cinema-frontend
spec:
  to:
    kind: Service
    name: cinema-frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
